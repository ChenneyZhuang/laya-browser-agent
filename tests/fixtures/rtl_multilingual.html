<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>موقع عربي</title>
<style>body{font-family:system-ui;margin:2rem}section{border:1px solid #ccc;padding:1rem;margin:1rem 0}</style>
</head>
<body>

<section lang="ar">
  <h2>نماذج عربية</h2>
  <button id="ar-pay">إتمام الشراء</button>
  <button id="ar-subscribe">اشترك في النشرة البريدية</button>
  <button id="ar-download">تحميل الملف</button>
  <a href="#ar-support" id="ar-support-link">الدعم الفني</a>
  <label for="ar-email">البريد الإلكتروني</label>
  <input type="email" id="ar-email" placeholder="أدخل بريدك الإلكتروني">
  <label for="ar-country">اختر دولتك</label>
  <select id="ar-country">
    <option value="SA">السعودية</option>
    <option value="EG">مصر</option>
    <option value="AE">الإمارات</option>
  </select>
  <label><input type="checkbox" id="ar-terms"> أوافق على الشروط والأحكام</label>
</section>

<section lang="he" dir="rtl">
  <h2>עברית</h2>
  <button id="he-login">התחברות</button>
  <button id="he-register">הרשמה</button>
  <input type="text" id="he-search" placeholder="חיפוש מוצרים">
  <label for="he-plan">בחר תוכנית</label>
  <select id="he-plan">
    <option value="free">חינם</option>
    <option value="pro">מקצועי</option>
  </select>
</section>

<section lang="fa" dir="rtl">
  <h2>فارسی</h2>
  <button id="fa-login">ورود به سیستم</button>
  <button id="fa-buy">خرید کردن</button>
</section>

<section lang="ur" dir="rtl">
  <h2>اردو</h2>
  <button id="ur-login">لاگ اِن کریں</button>
</section>

<section lang="mixed">
  <h2>mixed script within one label</h2>
  <button id="mx-1">Login ログイン</button>
  <button id="mx-2">Войти 登录</button>
  <button id="mx-3">🛒 カートに追加 Cart</button>
</section>

</body>
</html>
