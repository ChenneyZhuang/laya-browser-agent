<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>多语言测试站</title>
<style>body{font-family:system-ui;margin:2rem;max-width:44rem}section{border:1px solid #ccc;padding:1rem;margin:1rem 0}</style>
</head>
<body>

<section lang="zh">
  <h2>中文</h2>
  <button id="zh-login">登录</button>
  <button id="zh-register">注册新账号</button>
  <button id="zh-cart">加入购物车</button>
  <a href="#zh-help" id="zh-help-link">帮助中心</a>
  <input type="text" id="zh-search" placeholder="搜索商品">
  <label for="zh-city">选择城市</label>
  <select id="zh-city">
    <option value="bj">北京</option>
    <option value="sh">上海</option>
    <option value="gz">广州</option>
  </select>
</section>

<section lang="ja">
  <h2>日本語</h2>
  <button id="ja-login">ログイン</button>
  <button id="ja-cart">カートに追加</button>
  <a href="#ja-help" id="ja-help-link">ヘルプセンター</a>
  <input type="text" id="ja-search" placeholder="商品を検索">
</section>

<section lang="ko">
  <h2>한국어</h2>
  <button id="ko-login">로그인</button>
  <button id="ko-cart">장바구니에 담기</button>
  <input type="text" id="ko-search" placeholder="상품 검색">
</section>

<section lang="ar" dir="rtl">
  <h2>العربية</h2>
  <button id="ar-login">تسجيل الدخول</button>
  <button id="ar-cart">أضف إلى السلة</button>
  <input type="text" id="ar-search" placeholder="ابحث عن المنتجات">
</section>

<section lang="ru">
  <h2>Русский</h2>
  <button id="ru-login">Войти</button>
  <button id="ru-cart">Добавить в корзину</button>
</section>

<section lang="el">
  <h2>Ελληνικά</h2>
  <button id="el-login">Σύνδεση</button>
</section>

<section lang="th">
  <h2>ไทย</h2>
  <button id="th-login">เข้าสู่ระบบ</button>
</section>

<section lang="hi">
  <h2>हिन्दी</h2>
  <button id="hi-login">लॉग इन करें</button>
</section>

<section lang="vi">
  <h2>Tiếng Việt</h2>
  <button id="vi-login">Đăng nhập</button>
</section>

<section lang="tr">
  <h2>Türkçe</h2>
  <button id="tr-login">Giriş yap</button>
</section>

<section lang="emoji">
  <h2>Mixed / emoji labels</h2>
  <button id="em-cart">🛒 Add to basket</button>
  <button id="em-save">💾 Save changes</button>
  <button id="em-login">🔐 Log in</button>
</section>

</body>
</html>
