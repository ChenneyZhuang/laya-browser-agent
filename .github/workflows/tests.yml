name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The fast suite: harness rules with fake backends. Runs on every push, on every
  # platform users actually have, in seconds, without downloading any checkpoint.
  # The matrix is the "simulate below-M4 and everything else" answer: x86 Linux,
  # Windows, Intel macOS and Apple Silicon all run the same pure-Python harness, which
  # is exactly the code that must behave identically everywhere. Oldest and newest
  # Python are both covered because 3.10 vs 3.13 differ in ways that matter (typing,
  # importlib, dataclass behaviour).
  contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # x86_64 Linux server
            python: "3.10"          # oldest supported (laya PyPI dep requires >=3.10)
          - os: ubuntu-24.04        # x86_64 Linux
            python: "3.13"          # newest supported
          - os: windows-2022        # Windows x86_64
            python: "3.11"
          # Intel Mac. macos-13 was retired by GitHub (Dec 2025); macos-15-intel is the
          # official Intel replacement and is itself scheduled to retire in 2027, so this
          # platform has a countdown on it - x86_64 macOS support ends with it.
          - os: macos-15-intel      # Intel Mac (x86_64)
            python: "3.11"
          - os: macos-14            # Apple Silicon (M1)
            python: "3.12"
          - os: macos-15            # Apple Silicon (newer M-series)
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no model extras - the harness must not need one)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Prove no model runtime is present or required
        run: |
          import importlib.util as u
          present = u.find_spec("laya_mlx") is not None or u.find_spec("laya") is not None
          assert not present, "test leak: model extras installed"
        shell: python
      - name: Contract tests
        env:
          LOCALDECIDE_SKIP_LIVE: "1"
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Lint (correctness rules)
        run: |
          pip install ruff==0.16.9
          ruff check .

  browser-synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model-free browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[playwright,cdp]' pytest
          playwright install --with-deps chromium
      - name: Synthetic browser safety tests
        env:
          LOCALDECIDE_SKIP_LIVE: "1"
        run: python -m pytest -q tests/test_browser_safety.py tests/test_drivers.py

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and inspect source artifacts
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/localdecide-dist"
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path(__import__("os").environ["RUNNER_TEMP"]) / "localdecide-dist"
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))
          required = ("tests/_browser_child.py", "tests/fixtures/element_gym.html")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert any(name.endswith("scripts/run_live_batched.sh") for name in names)
              assert all(any(name.endswith(item) for name in names) for item in required)
          with tarfile.open(sdist) as archive:
              names = set(archive.getnames())
              assert any(name.endswith("scripts/run_live_batched.sh") for name in names)
              assert all(any(name.endswith(item) for name in names) for item in required)
          PY
      - name: Install and exercise wheel and sdist in isolated environments
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP/localdecide-dist"/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import importlib.util
          from pathlib import Path
          assert importlib.util.find_spec("localdecide") is not None
          tests_root = Path(importlib.util.find_spec("tests").submodule_search_locations[0])
          assert (tests_root / "_browser_child.py").exists()
          assert (tests_root / "fixtures" / "element_gym.html").exists()
          assert "Subprocess entry point" in (tests_root / "_browser_child.py").read_text()
          PY
          test -f "$RUNNER_TEMP/wheel-venv/scripts/run_live_batched.sh"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP/localdecide-dist"/*.tar.gz
          "$RUNNER_TEMP/sdist-venv/bin/python" - <<'PY'
          import importlib.util
          from pathlib import Path
          assert importlib.util.find_spec("localdecide") is not None
          tests_root = Path(importlib.util.find_spec("tests").submodule_search_locations[0])
          assert (tests_root / "_browser_child.py").exists()
          assert (tests_root / "fixtures" / "element_gym.html").exists()
          assert "Subprocess entry point" in (tests_root / "_browser_child.py").read_text()
          PY
          test -f "$RUNNER_TEMP/sdist-venv/scripts/run_live_batched.sh"

  # A real checkpoint on a real Apple Silicon runner - the closest CI gets to the
  # development machine. Opt-in (workflow_dispatch) on purpose: the v32b checkpoint is ~1.3 GB
  # (the browser-legacy v10s path is ~650 MB),
  # the runner has 7 GB, and that is enough for exactly one model OR one browser at a
  # time - which is why the live suite here still goes through the subprocess path and
  # the memory-checked batch script rather than one big pytest run.
  apple-silicon-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with model + browser
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[mlx,playwright,cdp]' pytest
          playwright install chromium
      - name: Live tests (batched, memory-checked)
        run: ./scripts/run_live_batched.sh
